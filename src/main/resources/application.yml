spring:
  config:
    import: optional:application-secrets.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/playlist_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.vidhan152.playlistTracker: INFO
    org.springframework.web.client: WARN

youtube:
  api:
    key: ${GOOGLE_YOUTUBE_API_KEY:${google.youtube-api-key}}
    base-url: https://www.googleapis.com/youtube/v3

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

groq:
  api:
    key: ${GROQ_API_KEY:${groq.api.key}}
    base-url: https://api.groq.com/openai/v1


transcript:
  service:
    url: ${TRANSCRIPT_SERVICE_URL:http://localhost:8000}
    secret: ${TRANSCRIPT_SERVICE_SECRET:dev-local-secret}